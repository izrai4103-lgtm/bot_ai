<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#212121">
<title>Bot AI - ChatGPT Clone</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-primary:#212121;--bg-secondary:#171717;--bg-tertiary:#2f2f2f;--bg-hover:#3a3a3a;--text-primary:#ececec;--text-secondary:#b4b4b4;--text-tertiary:#8e8e8e;--accent:#10a37f;--accent-hover:#0e8a6b;--border:#3a3a3a;--sidebar-width:260px;--header-height:60px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* Layout */
.app{display:flex;height:100dvh}
/* Sidebar */
.sidebar{width:var(--sidebar-width);background:var(--bg-secondary);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0;transition:transform .3s ease}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header .logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
.sidebar-header h1{font-size:16px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-chat-btn{margin:12px 16px;padding:12px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.new-chat-btn:hover{background:var(--bg-hover)}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-list::-webkit-scrollbar{width:6px}
.chat-list::-webkit-scrollbar-track{background:transparent}
.chat-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.chat-item{padding:12px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .15s}
.chat-item:hover{background:var(--bg-hover)}
.chat-item.active{background:var(--bg-tertiary)}
.chat-item .icon{width:18px;height:18px;border-radius:4px;background:var(--accent);flex-shrink:0;opacity:.7}
.chat-item .title{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-footer .avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text-secondary)}
.sidebar-footer .info{flex:1}
.sidebar-footer .name{font-size:14px;color:var(--text-primary)}
.sidebar-footer .status{font-size:12px;color:var(--text-tertiary)}
.clear-btn{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:18px;padding:6px;border-radius:6px;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clear-btn:hover{background:var(--bg-hover);color:#ef4444}
.clear-btn:active{transform:scale(0.95)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-primary);position:relative}
/* Header */
.header{height:var(--header-height);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.menu-btn{display:none;width:36px;height:36px;border:none;background:transparent;color:var(--text-primary);font-size:20px;cursor:pointer;border-radius:8px;align-items:center;justify-content:center}
.menu-btn:hover{background:var(--bg-hover)}
.header-title{font-size:16px;font-weight:600;color:var(--text-primary);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px}
.header-btn{width:36px;height:36px;border:none;background:transparent;color:var(--text-secondary);font-size:18px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
/* Messages */
.messages{flex:1;overflow-y:auto;padding:20px 0;scroll-behavior:auto}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.messages-inner{max-width:800px;margin:0 auto;padding:0 20px}
.message{margin-bottom:24px;display:flex;gap:16px;animation:fadeIn .3s ease}
.message.user{flex-direction:row-reverse;margin-left:auto;max-width:85%}
.message.assistant{margin-right:auto;max-width:85%}
.message.user .message-content{text-align:right}
.message.user .name{text-align:right}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}
}
.message-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;margin-top:4px}
.message-avatar.user{background:var(--accent);color:#fff}
.message-avatar.assistant{background:#5436da;color:#fff}
.message-content{flex:1;min-width:0;max-width:100%}
.message-content .name{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.message-content .text{font-size:15px;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;word-break:break-word}
.message-content .text p{margin-bottom:12px}
.message-content .text p:last-child{margin-bottom:0}
.message-content .text code{background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace}
.message-content .text pre{margin:12px 0;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto}
.message-content .text pre code{background:none;padding:0;font-size:13px;line-height:1.5}
.message-content .text ul,.message-content .text ol{padding-left:24px;margin:8px 0}
.message-content .text li{margin-bottom:4px}
.message-content .text h1,.message-content .text h2,.message-content .text h3,.message-content .text h4{margin:16px 0 8px;font-weight:600}
.message-content .text h1{font-size:20px}
.message-content .text h2{font-size:18px}
.message-content .text h3{font-size:16px}
.message-content .text blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0;color:var(--text-secondary);font-style:italic}
.message-content .text table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.message-content .text th,.message-content .text td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.message-content .text th{background:var(--bg-tertiary);font-weight:600}
.message-content .text a{color:var(--accent);text-decoration:none}
.message-content .text a:hover{text-decoration:underline}
.typing-indicator{display:flex;gap:4px;padding:4px 0}
.typing-indicator span{width:8px;height:8px;background:var(--text-tertiary);border-radius:50%;animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}
}
/* Thinking status like grok.ai */
.thinking-status{display:flex;align-items:center;gap:8px;padding:8px 0;color:var(--text-secondary);font-size:14px;animation:thinkingPulse 2s ease-in-out infinite}
@keyframes thinkingPulse{0%,100%{opacity:.6}50%{opacity:1}
}
.thinking-status .phase-dots{display:inline-flex;gap:3px}
.thinking-status .phase-dots span{width:4px;height:4px;background:var(--text-tertiary);border-radius:50%;animation:thinkingDot 1.4s infinite}
.thinking-status .phase-dots span:nth-child(2){animation-delay:.2s}
.thinking-status .phase-dots span:nth-child(3){animation-delay:.4s}
@keyframes thinkingDot{0%,60%,100%{opacity:.3}30%{opacity:1}
}
/* Input */
.input-area{border-top:1px solid var(--border);padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.input-inner{max-width:800px;margin:0 auto;position:relative}
.input-wrapper{display:flex;align-items:flex-end;gap:8px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:16px;padding:8px 12px;transition:border-color .2s}
.input-wrapper:focus-within{border-color:var(--accent)}
.input-wrapper textarea{flex:1;border:none;background:transparent;color:var(--text-primary);font-size:15px;font-family:var(--font);outline:none;resize:none;max-height:200px;line-height:1.5;padding:4px 0}
.input-wrapper textarea::placeholder{color:var(--text-tertiary)}
.send-btn{width:36px;height:36px;border:none;background:var(--accent);border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;opacity:.7}
.send-btn.active{opacity:1}
.send-btn.active:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.3;cursor:default}
.input-footer{display:flex;justify-content:center;padding:8px 0 0;gap:16px}
.input-footer span{font-size:11px;color:var(--text-tertiary)}
/* Error */
.error-msg{padding:12px 16px;background:#3d1a1a;border:1px solid #5c2a2a;border-radius:8px;color:#ff6b6b;font-size:14px;margin-bottom:12px}
/* Scroll lock indicator */

/* Mobile overlay */
.sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:98}
/* Responsive */
@media(max-width:768px){
.sidebar{position:fixed;left:0;top:0;height:100%;z-index:99;transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay.show{display:block}
.menu-btn{display:flex}
.header-title{font-size:14px}
.messages-inner{padding:0 16px}
.message-content .text{font-size:14px}
.input-area{padding:12px 16px}
}
@media(max-width:480px){
.header{padding:0 12px}
.message{gap:12px}
.message-avatar{width:28px;height:28px;font-size:12px}
}
/* Model badge */
.model-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-tertiary);border-radius:8px;font-size:13px;color:var(--text-secondary)}
/* Stop button */
.stop-btn{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px;padding:8px 20px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:24px;color:var(--text-primary);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s}
.stop-btn:hover{background:var(--bg-hover)}
.stop-btn.show{display:block}
/* Copy button */
.copy-btn{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:4px;transition:background .15s;margin-left:auto;flex-shrink:0}
.copy-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.message-actions{display:flex;align-items:center;margin-top:8px;gap:8px}
.message-actions button{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:4px;transition:background .15s;display:flex;align-items:center;gap:4px}
.message-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">B</div>
      <h1>Bot AI</h1>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Chat Baru
    </button>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="avatar">U</div>
      <div class="info">
        <div class="name">User</div>
        <div class="status">Online</div>
      </div>
      <button class="clear-btn" onclick="clearHistory()" title="Hapus semua chat">🗑️</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Header -->
    <header class="header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-title" id="headerTitle">Bot AI<span id="webSearchIndicator" style="display:none;font-size:11px;background:rgba(16,163,127,.15);color:var(--accent);padding:2px 8px;border-radius:10px;margin-left:8px">🌐 Web</span></div>
      <div class="header-actions">
        <div class="model-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span>Qwen 3.6 27B</span>
        </div>
      </div>
    </header>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="messages-inner" id="messagesInner">
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-inner">
        
        <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">■ Stop</button>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <button class="search-toggle" id="searchToggle" onclick="toggleWebSearch()"><span class="icon">🌐</span><span class="label">Cari Web</span></button>
        </div>
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="Kirim pesan..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="input-footer">
          <span>Bot AI dapat membuat kesalahan. Periksa informasi penting.</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ============ STATE ============
let messages = [];
let currentModel = 'qwen/qwen3.6-27b';
let 
      // Hide web search indicator
      const wsk = document.getElementById('webSearchIndicator');
      if (wsk) wsk.style.display = 'none';
isGenerating = false;
let abortController = null;
let chatHistory = JSON.parse(localStorage.getItem('bot_ai_chats') || '[]');
let activeChatId = localStorage.getItem('bot_ai_active_chat') || null;
let msgCounter = 0;

// Thinking phases (like grok.ai)
const THINKING_PHASES = [
  { icon: '🧠', text: 'Menganalisis pertanyaan...' },
  { icon: '🔍', text: 'Memeriksa data...' },
  { icon: '📚', text: 'Mencari referensi...' },
  { icon: '💭', text: 'Menyusun konsep...' },
  { icon: '✍️', text: 'Menulis jawaban...' },
  { icon: '📝', text: 'Merangkum...' },
];

let thinkingInterval = null;
let thinkingPhaseIndex = 0;

// ============ DOM ============
const messagesEl = document.getElementById('messages');
const messagesInner = document.getElementById('messagesInner');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const headerTitle = document.getElementById('headerTitle');
const chatList = document.getElementById('chatList');

// ============ SIDEBAR ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

// ============ MODEL ============
// Using Qwen 3.6 27B (single model)

// ============ CHAT INPUT ============
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  sendBtn.disabled = !el.value.trim();
  sendBtn.classList.toggle('active', el.value.trim().length > 0);
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}


// ============ SEND MESSAGE ============

// ============ WEB SEARCH ============
let webSearchEnabled = false;

function toggleWebSearch() {
  webSearchEnabled = !webSearchEnabled;
  const btn = document.getElementById('searchToggle');
  if (btn) {
    btn.classList.toggle('active', webSearchEnabled);
    btn.innerHTML = webSearchEnabled ? '<span class="icon">🌐</span><span class="label">Cari Web: ON</span>' : '<span class="icon">🌐</span><span class="label">Cari Web</span>';
  }
}

// Check web search availability
async function checkWebSearch() {
  try {
    const res = await fetch('/api/web/config');
    const data = await res.json();
    const btn = document.getElementById('searchToggle');
    if (btn) {
      if (!data.available) {
        btn.title = 'Google API Key belum dikonfigurasi. Web search mungkin terbatas.';
        btn.style.opacity = '0.6';
      }
    }
  } catch(e) {}
}

// Check on init
checkWebSearch();

// Search the web directly
async function searchWeb(query) {
  try {
    const res = await fetch('/api/web/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    const data = await res.json();
    return data.results || [];
  } catch (e) {
    return [];
  }
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isGenerating) return;

  chatInput.value = '';
  autoResize(chatInput);
  sendBtn.disabled = true;
  sendBtn.classList.remove('active');
  
  // Add user message
  addMessage('user', text);
  
  // Show AI message placeholder with thinking phase
  const msgId = 'msg-' + Date.now() + '-' + (++msgCounter);
  addMessage('assistant', '', msgId, true);
  
  // Start rotating thinking phases
  thinkingPhaseIndex = 0;
  const thinkingEl = document.getElementById(msgId);
  if (thinkingEl) {
    const textEl = thinkingEl.querySelector('.text');
    if (textEl) {
      textEl.innerHTML = '<div class="thinking-status">' + THINKING_PHASES[0].icon + ' ' + THINKING_PHASES[0].text + '</div>';
    }
  }
  
  if (thinkingInterval) clearInterval(thinkingInterval);
  thinkingInterval = setInterval(() => {
    thinkingPhaseIndex = (thinkingPhaseIndex + 1) % THINKING_PHASES.length;
    const el = document.getElementById(msgId);
    if (el) {
      const tEl = el.querySelector('.text');
      if (tEl && !el.dataset.contentReceived) {
        tEl.innerHTML = '<div class="thinking-status">' + THINKING_PHASES[thinkingPhaseIndex].icon + ' ' + THINKING_PHASES[thinkingPhaseIndex].text + '</div>';,
        web_search: webSearchEnabled
      }
    }
  }, 2500);
  
  // Save chat
  saveChat(text, '');
  
  // Lock scroll and send to API
  
      // Show web search indicator
      const wsk = document.getElementById('webSearchIndicator');
      if (wsk) wsk.style.display = webSearchEnabled ? 'inline' : 'none';
isGenerating = true;
  stopBtn.classList.add('show');
  abortController = new AbortController();
  lockScroll();
  scrollToBottom();
  
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: currentModel }),
      signal: abortController.signal
    });

    if (!res.ok) throw new Error('Network error');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            if (parsed.error) {
              updateMessage(msgId, 'Error: ' + parsed.error);
              continue;
            }
            if (parsed.content) {
              fullContent += parsed.content;
              updateMessage(msgId, fullContent);
            }
          } catch {}
        }
      }
    }

    // Update chat history with response
    updateChatHistory(text, fullContent);
    
  } catch (err) {
    if (err.name === 'AbortError') {
      updateMessage(msgId, '⏸️ Generasi dihentikan.');
    } else {
      updateMessage(msgId, '❌ Error: ' + err.message + '\n\nSilakan coba lagi atau refresh halaman.');
    }
  } finally {
    if (thinkingInterval) {
      clearInterval(thinkingInterval);
      thinkingInterval = null;
    }
    isGenerating = false;
    stopBtn.classList.remove('show');
    abortController = null;
    unlockScroll();
    scrollToBottom();
  }
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
  }
  unlockScroll();
}

// ============ MESSAGES ============
function addMessage(role, content, id, isTyping) {
  const msgId = id || 'msg-' + Date.now() + '-' + (++msgCounter);
  const name = role === 'user' ? 'User' : 'Bot AI';
  const avatar = role === 'user' ? 'U' : 'B';
  
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.id = msgId;
  
  div.innerHTML = `
    <div class="message-avatar ${role}">${avatar}</div>
    <div class="message-content">
      <div class="name">${name}</div>
      <div class="text">${isTyping ? '<div class="typing-indicator"><span></span><span></span><span></span></div>' : formatContent(content)}</div>
      ${role === 'assistant' && content ? '<div class="message-actions"><button onclick="copyMessage(\'' + msgId + '\')">📋 Salin</button></div>' : ''}
    </div>
  `;
  
  messagesInner.appendChild(div);
  messages.push({ id: msgId, role, content });
  
  return msgId;
}

function updateMessage(id, content) {
  const el = document.getElementById(id);
  if (!el) return;
  
  // Mark as content received (stop thinking phases)
  el.dataset.contentReceived = 'true';
  if (thinkingInterval) {
    clearInterval(thinkingInterval);
    thinkingInterval = null;
  }
  
  const textEl = el.querySelector('.text');
  if (!textEl) return;
  textEl.innerHTML = formatContent(content);
  
  // Add actions if not present
  if (!el.querySelector('.message-actions') && content && !content.startsWith('⏸️') && !content.startsWith('❌')) {
    const contentDiv = el.querySelector('.message-content');
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    actions.innerHTML = '<button onclick="copyMessage(\'' + id + '\')">📋 Salin</button>';
    contentDiv.appendChild(actions);
  }
}

function formatContent(text) {
  if (!text) return '';
  // Escape HTML
  let esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Code blocks
  esc = esc.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
  // Inline code
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Italic
  esc = esc.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Links
  esc = esc.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Lists
  esc = esc.replace(/^- (.+)$/gm, '<li>$1</li>');
  // Newlines to paragraphs
  esc = esc.split('\n\n').filter(p => p.trim()).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return esc;
}

function copyMessage(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.querySelector('.text')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.querySelector('.message-actions button');
    if (btn) { btn.textContent = '✅ Disalin!'; setTimeout(() => { btn.textContent = '📋 Salin'; }, 2000); }
  });
}

// ============ SCROLL ============
// Lock scroll during AI generation (like ChatGPT)
function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}
function lockScroll() {
  messagesEl.style.overflowY = 'hidden';
  scrollToBottom();
}
function unlockScroll() {
  messagesEl.style.overflowY = 'auto';
}
// Patch addMessage to auto-scroll
const _origAddMessage = addMessage;
addMessage = function(role, content, id, isTyping) {
  const result = _origAddMessage.call(this, role, content, id, isTyping);
  if (isGenerating) scrollToBottom();
  return result;
};
// Patch updateMessage to auto-scroll
const _origUpdateMessage = updateMessage;
updateMessage = function(id, content) {
  _origUpdateMessage.call(this, id, content);
  if (isGenerating) scrollToBottom();
};

// ============ SUGGESTIONS ============

// ============ NEW CHAT ============
function newChat() {
  messages = [];
  messagesInner.innerHTML = "";
  chatInput.value = "";
  autoResize(chatInput);
  sendBtn.disabled = true;
  sendBtn.classList.remove("active");
  headerTitle.textContent = "Bot AI";
  activeChatId = null;
  localStorage.removeItem("bot_ai_active_chat");
  
  if (window.innerWidth <= 768) toggleSidebar();
  renderChatList();
}

function clearHistory() {
  if (!confirm("Hapus semua riwayat chat?")) return;
  chatHistory = [];
  localStorage.removeItem("bot_ai_chats");
  localStorage.removeItem("bot_ai_active_chat");
  activeChatId = null;
  messages = [];
  messagesInner.innerHTML = "";
  headerTitle.textContent = "Bot AI";
  renderChatList();
  newChat();
}

// ============ CHAT HISTORY ============
function saveChat(userMsg, aiMsg) {
  if (!activeChatId) {
    activeChatId = 'chat-' + Date.now();
    localStorage.setItem('bot_ai_active_chat', activeChatId);
    chatHistory.push({ id: activeChatId, title: userMsg.slice(0, 50), messages: [], timestamp: Date.now() });
  }
  
  const chat = chatHistory.find(c => c.id === activeChatId);
  if (chat) {
    chat.messages.push({ role: 'user', content: userMsg });
    if (aiMsg) chat.messages.push({ role: 'assistant', content: aiMsg });
    if (chat.title === userMsg.slice(0, 50)) chat.title = userMsg.slice(0, 50);
  }
  
  localStorage.setItem('bot_ai_chats', JSON.stringify(chatHistory));
  renderChatList();
}

function updateChatHistory(userMsg, aiMsg) {
  const chat = chatHistory.find(c => c.id === activeChatId);
  if (chat) {
    chat.messages.push({ role: 'assistant', content: aiMsg });
  }
  localStorage.setItem('bot_ai_chats', JSON.stringify(chatHistory));
}

function renderChatList() {
  chatList.innerHTML = '';
  chatHistory.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
    div.innerHTML = `<div class="icon"></div><div class="title">${chat.title || 'Chat baru'}</div>`;
    div.onclick = () => loadChat(chat.id);
    chatList.appendChild(div);
  });
}

function loadChat(chatId) {
  const chat = chatHistory.find(c => c.id === chatId);
  if (!chat) return;
  
  activeChatId = chatId;
  localStorage.setItem('bot_ai_active_chat', activeChatId);
  messagesInner.innerHTML = '';
  
  messages = [];
  chat.messages.forEach(msg => {
    addMessage(msg.role, msg.content);
  });
  
  headerTitle.textContent = chat.title || 'Chat';
  
  if (window.innerWidth <= 768) toggleSidebar();
  renderChatList();
}

// ============ INIT ============
renderChatList();

// Load active chat if exists
if (activeChatId) {
  loadChat(activeChatId);
}

// Initial scroll indicator state
// Fix for iOS Safari viewport height
function fixViewport() {
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
}
fixViewport();
window.addEventListener('resize', fixViewport);
</script>
