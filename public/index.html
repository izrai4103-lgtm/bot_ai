<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Chat AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#fff;color:#343541;-webkit-font-smoothing:antialiased}

    #app{width:100%;max-width:800px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#fff}
    @media(min-width:768px){#app{border-left:1px solid #e5e5e5;border-right:1px solid #e5e5e5}}
    @media(max-height:500px) and (orientation:landscape){#app{max-width:100%}}

    /* Header */
    .header{display:flex;align-items:center;justify-content:center;padding:14px 16px;flex-shrink:0;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid #e5e5e5;background:#fff;position:relative}
    .header h1{font-size:16px;font-weight:600;color:#343541;display:flex;align-items:center;gap:6px}
    .header h1 .label{font-size:11px;font-weight:500;color:#8e8ea0;background:#f4f4f5;padding:2px 8px;border-radius:100px;letter-spacing:.2px}
    .header-right{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
    .header-btn{width:32px;height:32px;border:none;border-radius:6px;background:transparent;color:#8e8ea0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s}
    .header-btn:hover{background:#f4f4f5;color:#343541}
    .header-btn:active{background:#e5e5e5}

    /* Messages */
    .chat-box{flex:1;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:#fff}
    .chat-box-inner{padding:16px 0 8px;max-width:700px;margin:0 auto;width:100%}
    @media(min-width:768px){.chat-box-inner{padding:24px 0 8px}}

    .msg{padding:8px 24px;display:flex;gap:14px;line-height:1.6}
    @media(min-width:768px){.msg{padding:12px 32px;gap:18px}}

    .msg.user{background:#fff}
    .msg.assistant{background:#f7f7f8}

    .msg-avatar{width:30px;height:30px;border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
    .msg.user .msg-avatar{background:#5436da;color:#fff;border-radius:4px}
    .msg.assistant .msg-avatar{background:#10a37f;color:#fff;border-radius:4px}

    .msg-body{flex:1;min-width:0}
    .msg-body .content{font-size:15px;color:#343541;white-space:pre-wrap;word-wrap:break-word}
    .msg-body .content p{margin-bottom:8px}

    .msg-footer{display:flex;align-items:center;gap:8px;margin-top:6px}
    .msg-footer .time{font-size:11px;color:#c5c5d2}

    /* Empty state */
    .empty-state{padding:60px 24px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
    .empty-state .icon{font-size:48px;margin-bottom:20px;opacity:.6}
    .empty-state h2{font-size:20px;font-weight:600;color:#343541;margin-bottom:8px}
    .empty-state p{font-size:14px;color:#8e8ea0;max-width:360px;line-height:1.5}
    .empty-state .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px;max-width:400px}
    .empty-state .suggestions button{background:#f4f4f5;border:1px solid #e5e5e5;border-radius:100px;padding:8px 16px;font-size:13px;color:#343541;cursor:pointer;transition:background .15s}
    .empty-state .suggestions button:hover{background:#e5e5e5}

    /* Input */
    .input-area{flex-shrink:0;padding:0 16px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff}
    @media(max-height:500px){.input-area{padding:0 12px 8px}}
    .input-wrap-inner{max-width:700px;margin:0 auto;position:relative;border:1px solid #c5c5d2;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:box-shadow .2s,border-color .2s}
    .input-wrap-inner:focus-within{border-color:#8e8ea0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .input-wrap-inner textarea{width:100%;padding:12px 48px 12px 16px;border:none;border-radius:12px;background:transparent;color:#343541;font-size:15px;font-family:inherit;line-height:1.5;outline:none;resize:none;-webkit-appearance:none;min-height:44px;max-height:160px}
    .input-wrap-inner textarea::placeholder{color:#8e8ea0}
    .input-wrap-inner textarea:disabled{opacity:.4}

    .send-btn{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border:none;border-radius:8px;background:#343541;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
    .send-btn:active{background:#1d1d1e}
    .send-btn:disabled{background:#c5c5d2;cursor:default}
    .send-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* Typing */
    .typing-indicator{display:flex;align-items:center;gap:4px;padding:4px 0}
    .typing-indicator span{width:6px;height:6px;border-radius:50%;background:#c5c5d2;animation:typing 1.4s infinite ease-in-out}
    .typing-indicator span:nth-child(2){animation-delay:.2s}
    .typing-indicator span:nth-child(3){animation-delay:.4s}
    @keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px);background:#8e8ea0}}

    /* Toast */
    .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:#343541;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:100}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <h1>
        Chat AI
        <span class="label">GROQ</span>
      </h1>
      <div class="header-right">
        <button class="header-btn" onclick="resetChat()" title="New chat">✕</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-box" id="chatBox">
      <div class="chat-box-inner" id="chatInner">
        <div class="empty-state">
          <div class="icon">💬</div>
          <h2>Apa yang bisa saya bantu?</h2>
          <p>Saya menggunakan Groq Llama 3.3 70B — cepat dan gratis.</p>
          <div class="suggestions">
            <button onclick="quickAsk('Jelaskan AI dalam bahasa sederhana')">Jelaskan AI</button>
            <button onclick="quickAsk('Buatkan puisi tentang coding')">Puisi coding</button>
            <button onclick="quickAsk('Apa itu Groq?')">Apa itu Groq?</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap-inner">
        <textarea id="inputMsg" rows="1" placeholder="Kirim pesan..." autofocus></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMsg()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id)
    const chatInner = $('chatInner'), input = $('inputMsg'), btn = $('sendBtn')
    const toast = $('toast'), chatBox = $('chatBox')

    let h = [], busy = false, tt = null

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto'
      input.style.height = Math.min(input.scrollHeight, 160) + 'px'
    })

    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg() }
    })

    function quickAsk(text) {
      input.value = text
      sendMsg()
    }

    async function sendMsg() {
      const text = input.value.trim()
      if(!text || busy) return

      append('user', text)
      input.value = ''
      input.style.height = 'auto'
      busy = true
      btn.disabled = true
      input.disabled = true

      const typingEl = document.createElement('div')
      typingEl.className = 'msg assistant'
      typingEl.innerHTML = '<div class="msg-avatar">✦</div><div class="msg-body"><div class="typing-indicator"><span></span><span></span><span></span></div></div>'
      chatInner.appendChild(typingEl)
      scrollDown()

      try {
        const r = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message:text, history:h})
        })
        const d = await r.json()
        typingEl.remove()

        if(r.ok) {
          append('assistant', d.reply)
          h.push({role:'user', content:text})
          h.push({role:'assistant', content:d.reply})
        } else {
          show(d.error || 'Gagal')
        }
      } catch(e) {
        typingEl.remove()
        show('Koneksi terputus')
      }

      busy = false
      btn.disabled = false
      input.disabled = false
      input.focus()
    }

    function append(role, text) {
      const u = role === 'user'
      const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})

      // Remove empty state if present
      const empty = chatInner.querySelector('.empty-state')
      if(empty) empty.remove()

      const div = document.createElement('div')
      div.className = `msg ${u ? 'user' : 'assistant'}`
      div.innerHTML = `
        <div class="msg-avatar">${u ? 'U' : '✦'}</div>
        <div class="msg-body">
          <div class="content">${esc(text)}</div>
          <div class="msg-footer"><span class="time">${t}</span></div>
        </div>`
      chatInner.appendChild(div)
      scrollDown()
    }

    function resetChat() {
      const msgs = chatInner.querySelectorAll('.msg')
      if(!msgs.length) return
      h = []
      chatInner.innerHTML = ''
      chatInner.innerHTML = `
        <div class="empty-state">
          <div class="icon">💬</div>
          <h2>Apa yang bisa saya bantu?</h2>
          <p>Saya menggunakan Groq Llama 3.3 70B — cepat dan gratis.</p>
          <div class="suggestions">
            <button onclick="quickAsk('Jelaskan AI dalam bahasa sederhana')">Jelaskan AI</button>
            <button onclick="quickAsk('Buatkan puisi tentang coding')">Puisi coding</button>
            <button onclick="quickAsk('Apa itu Groq?')">Apa itu Groq?</button>
          </div>
        </div>`
      scrollDown()
      show('Percakapan baru')
    }

    function scrollDown() { chatBox.scrollTop = chatBox.scrollHeight }

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML }
    function show(msg) {
      toast.textContent = msg
      clearTimeout(tt)
      void toast.offsetWidth
      toast.classList.add('show')
      tt = setTimeout(() => toast.classList.remove('show'), 1800)
    }
  </script>
</body>
</html>
