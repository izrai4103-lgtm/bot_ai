<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Chat AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gray: {
              50: '#f9fafb',
              100: '#f3f4f6',
              200: '#e5e7eb',
              300: '#d1d5db',
              400: '#9ca3af',
              500: '#6b7280',
              600: '#4b5563',
              700: '#374151',
              800: '#1f2937',
              850: '#1a1d23',
              900: '#111827',
              950: '#030712'
            }
          }
        }
      }
    }
  </script>
  <style>
    html,body{height:100%;overflow:hidden;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(215,215,215,.6);border-radius:999px;border:1px solid #fff}
    .dark ::-webkit-scrollbar-thumb{background:rgba(67,67,67,.6);border-color:#000}

    /* ── Layout ── */
    #app{display:flex;height:100dvh;width:100%}
    @media(min-width:768px){#app{max-width:1000px;margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}}

    /* ── Sidebar ── */
    .sidebar{width:260px;flex-shrink:0;background:#171717;color:#fff;display:flex;flex-direction:column;overflow:hidden}
    .dark .sidebar{background:#000}
    .sidebar-header{padding:14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
    .sidebar-header h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
    .sidebar-header h1 .badge{font-size:9px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px;font-weight:400}
    .sidebar-body{flex:1;overflow-y:auto;padding:8px}

    /* ── Main chat ── */
    .main{flex:1;display:flex;flex-direction:column;background:#fff;min-width:0}
    .dark .main{background:#1f2937;color:#e5e7eb}

    /* ── Messages ── */
    .chat-box{flex:1;overflow-y:auto;overflow-anchor:none;-webkit-overflow-scrolling:touch}
    .chat-inner{max-width:58rem;margin:0 auto;padding:8px 0;width:100%}

    .msg{display:flex;gap:10px;padding:10px 14px;line-height:1.6;animation:fi .2s ease both}
    @media(min-width:640px){.msg{padding:12px 20px;gap:14px}}
    @keyframes fi{from{opacity:0}to{opacity:1}}

    .msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-top:2px;overflow:hidden}
    .msg.user .msg-avatar{background:#5436da;color:#fff}
    .msg.assistant .msg-avatar{background:#10a37f;color:#fff;font-size:13px}
    .dark .msg.user .msg-avatar{background:#7c5cfc}
    .dark .msg.assistant .msg-avatar{background:#0d9e7a}

    .msg-body{flex:1;min-width:0;font-size:14px;color:#374151;line-height:1.65}
    .dark .msg-body{color:#e5e7eb}

    .msg-name{font-size:13px;font-weight:600;color:#111827;margin-bottom:2px}
    .dark .msg-name{color:#f3f4f6}
    .msg-name .time{font-weight:400;color:#9ca3af;font-size:11px;margin-left:6px}

    /* markdown */
    .msg-body p{margin-bottom:6px}
    .msg-body p:last-child{margin-bottom:0}
    .msg-body ul,.msg-body ol{padding-left:20px;margin:6px 0}
    .msg-body li{margin-bottom:2px}
    .msg-body code{background:#f3f4f6;padding:2px 5px;border-radius:3px;font-size:13px;font-family:'SF Mono','Fira Code',monospace;color:#1f2937}
    .dark .msg-body code{background:#374151;color:#e5e7eb}
    .msg-body pre{margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb}
    .dark .msg-body pre{border-color:#374151}
    .msg-body pre code{background:#f9fafb;padding:12px 14px;display:block;overflow-x:auto;font-size:13px;line-height:1.5}
    .dark .msg-body pre code{background:#1f2937}
    .msg-body blockquote{border-left:3px solid #e5e7eb;padding:3px 10px;margin:6px 0;color:#6b7280}
    .msg-body table{border-collapse:collapse;margin:6px 0;width:100%}
    .msg-body th,.msg-body td{border:1px solid #e5e7eb;padding:4px 8px;text-align:left;font-size:13px}
    .msg-body th{background:#f9fafb;font-weight:600}
    .msg-body a{color:#10a37f;text-decoration:none}
    .msg-body a:hover{text-decoration:underline}
    .msg-body h1,.msg-body h2,.msg-body h3,.msg-body h4{margin:10px 0 4px;font-weight:600;color:#111827}
    .dark .msg-body h1,.dark .msg-body h2,.dark .msg-body h3,.dark .msg-body h4{color:#f3f4f6}
    .msg-body h1{font-size:17px}.msg-body h2{font-size:15px}.msg-body h3{font-size:14px}

    .stream-cursor::after{content:'▊';animation:blink .8s step-end infinite;color:#6b7280}
    @keyframes blink{50%{opacity:0}}

    /* ── Input ── */
    .input-wrap{flex-shrink:0;padding:12px 16px 16px;padding-bottom:calc(16px+env(safe-area-inset-bottom,0px));border-top:1px solid #e5e7eb}
    .dark .input-wrap{border-color:#374151}
    .input-inner{display:flex;align-items:flex-end;gap:8px;max-width:58rem;margin:0 auto;padding:8px 8px 8px 16px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .input-inner:focus-within{border-color:#10a37f}
    .dark .input-inner{background:#1f2937;border-color:#4b5563}
    .dark .input-inner:focus-within{border-color:#10a37f}
    .input-inner textarea{flex:1;border:none;background:transparent;color:#374151;font-size:14px;font-family:inherit;line-height:1.5;outline:none;resize:none;-webkit-appearance:none;min-height:24px;max-height:120px;padding:2px 0}
    .dark .input-inner textarea{color:#e5e7eb}
    .input-inner textarea::placeholder{color:#9ca3af}

    .input-actions{display:flex;gap:4px;flex-shrink:0}
    .send-btn,.stop-btn{width:28px;height:28px;border:none;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .stop-btn{background:#ef4444;color:#fff;display:none}
    .stop-btn:hover{background:#dc2626}
    .send-btn{background:#111827;color:#fff}
    .send-btn:hover{background:#374151}
    .send-btn:active,.stop-btn:active{transform:scale(.9)}
    .send-btn:disabled{background:#9ca3af;cursor:default;transform:none}
    .dark .send-btn{background:#3b82f6}
    .dark .send-btn:hover{background:#2563eb}
    .dark .send-btn:disabled{background:#4b5563}
    .send-btn svg,.stop-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* ── Empty ── */
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 24px 60px;text-align:center}
    .empty h2{font-size:18px;font-weight:600;color:#111827;margin-bottom:4px}
    .dark .empty h2{color:#f3f4f6}
    .empty p{font-size:13px;color:#6b7280;margin-bottom:20px}
    .empty .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .empty .chips button{background:#f9fafb;border:1px solid #e5e7eb;border-radius:999px;padding:5px 12px;font-size:12px;color:#374151;cursor:pointer;transition:all .15s}
    .empty .chips button:hover{background:#f3f4f6;border-color:#9ca3af}
    .dark .empty .chips button{background:#1f2937;border-color:#374151;color:#e5e7eb}
    .dark .empty .chips button:hover{background:#374151;border-color:#6b7280}

    /* ── Mobile ── */
    @media(max-width:767px){.sidebar{display:none}}

    /* ── Toast ── */
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.85);backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s ease;pointer-events:none;z-index:100;text-align:center;max-width:260px}
    .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  </style>
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Chat AI <span class="badge">GROQ</span></h1>
      </div>
      <div class="sidebar-body">
        <div class="text-xs text-gray-400 px-2 py-1">Chats</div>
        <div class="text-xs text-gray-500 px-2 py-8 text-center">Belum ada chat</div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- MESSAGES -->
      <div class="chat-box" id="chatBox">
        <div class="chat-inner" id="chatInner">
          <div class="empty" id="emptyState">
            <h2>Ada yang bisa saya bantu?</h2>
            <p>Groq Llama 3.3 70B — streaming, bahasa Indonesia</p>
            <div class="chips">
              <button onclick="quick('Jelaskan machine learning')">🧠 ML</button>
              <button onclick="quick('Buat kode Python')">🐍 Python</button>
              <button onclick="quick('Apa itu API?')">🌐 API</button>
            </div>
          </div>
        </div>
      </div>

      <!-- INPUT -->
      <div class="input-wrap">
        <div class="input-inner">
          <textarea id="inputMsg" rows="1" placeholder="Kirim pesan..." autofocus></textarea>
          <div class="input-actions">
            <button class="stop-btn" id="stopBtn" onclick="stopStream()">
              <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
            <button class="send-btn" id="sendBtn" onclick="sendMsg()">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id)
    const inner = $('chatInner'), input = $('inputMsg'), btn = $('sendBtn'), stopBtn = $('stopBtn')
    const toast = $("toast"), chatBox = $('chatBox')

    let history = [], busy = false, tt = null, ac = null

    if(typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true })

    input.addEventListener('input', () => {
      input.style.height = 'auto'
      input.style.height = Math.min(input.scrollHeight, 120) + 'px'
    })
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg() }
    })

    function quick(t) { input.value = t; sendMsg() }

    function append(role, text) {
      const u = role === 'user'
      const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})
      const _empty=inner.querySelector(".empty");if(_empty)_empty.remove()

      const div = document.createElement('div')
      div.className = `msg ${u ? 'user' : 'assistant'}`
      div.innerHTML = `<div class="msg-avatar">${u ? 'U' : '✦'}</div><div class="msg-body"><div class="msg-name">${u ? 'Kamu' : 'Asisten'}<span class="time">${t}</span></div><div class="msg-content">${esc(text)}</div></div>`
      inner.appendChild(div)
    }

    async function sendMsg() {
      const text = input.value.trim()
      if(!text || busy) return

      append('user', text)
      input.value = ''; input.style.height = 'auto'
      busy = true; btn.style.display = 'none'; stopBtn.style.display = 'flex'; input.disabled = true
      const _empty=inner.querySelector(".empty");if(_empty)_empty.remove()

      const div = document.createElement('div')
      div.className = 'msg assistant'
      div.innerHTML = '<div class="msg-avatar">✦</div><div class="msg-body"><div class="msg-name">Asisten</div><div class="msg-content"><span class="stream-cursor"></span></div></div>'
      inner.appendChild(div)
      const ce = div.querySelector('.msg-content')

      try {
        ac = new AbortController()
        const res = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ message: text, history, stream: true }),
          signal: ac.signal
        })

        if(!res.ok) {
          const d = await res.json().catch(()=>({}))
          throw new Error(d.error || 'Gagal')
        }

        const reader = res.body.getReader()
        const dec = new TextDecoder()
        let buf = '', reply = ''

        while(true) {
          const { done, value } = await reader.read()
          if(done) break

          buf += dec.decode(value, { stream: true })
          const lines = buf.split('\n')
          buf = lines.pop() || ''

          for(const line of lines) {
            if(!line.startsWith('data: ')) continue
            const json = line.slice(6).trim()
            if(!json) continue

            try {
              const data = JSON.parse(json)
              if(data.error) throw new Error(data.error)
              if(data.done) { reply = data.fullContent || reply; continue }
              if(data.content) {
                reply += data.content
                const sp=chatBox.scrollTop,sh=chatBox.scrollHeight
                try { ce.innerHTML = marked.parse(reply) + '<span class="stream-cursor"></span>' }
                catch(e) { ce.innerHTML = esc(reply) + '<span class="stream-cursor"></span>' }
                if(chatBox.scrollHeight!==sh) chatBox.scrollTop=sp
              }
            } catch(e) {
              if(e.message !== 'Unexpected end of JSON input') console.error(e)
            }
          }
        }

        const sp=chatBox.scrollTop,sh=chatBox.scrollHeight
        ce.innerHTML = marked.parse(reply)
        if(chatBox.scrollHeight!==sh) chatBox.scrollTop=sp
        if(typeof hljs !== 'undefined') document.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b))

        const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})
        const nameEl = div.querySelector('.msg-name')
        if(nameEl) nameEl.innerHTML = 'Asisten <span class="time">' + t + '</span>'

        history.push({role:'user', content:text})
        history.push({role:'assistant', content:reply})

      } catch(e) {
        if(e.name==='AbortError') return
        if(ce) ce.textContent = '⚠️ ' + (e.message || 'Gagal')
      }

      busy = false; btn.style.display = 'flex'; stopBtn.style.display = 'none'
      input.disabled = false; input.focus()
    }

    function stopStream() { if(ac) { ac.abort(); ac=null; show('Dibentikan') } }

    function resetChat() {
      if(!inner.querySelectorAll('.msg').length) return
      history = []; inner.innerHTML = ''
      inner.innerHTML = '<div class="empty" id="emptyState"><h2>Ada yang bisa saya bantu?</h2><p>Groq Llama 3.3 70B — streaming, bahasa Indonesia</p><div class="chips"><button onclick="quick(\'Jelaskan machine learning\')">🧠 ML</button><button onclick="quick(\'Buat kode Python\')">🐍 Python</button><button onclick="quick(\'Apa itu API?\')">🌐 API</button></div></div>'
      show('Percakapan baru')
    }

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML }
    function show(m) {
      toast.textContent = m; clearTimeout(tt); void toast.offsetWidth
      toast.classList.add('show'); tt=setTimeout(()=>toast.classList.remove('show'),1800)
    }
  </script>
</body>
</html>
