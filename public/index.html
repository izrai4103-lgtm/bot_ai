<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot AI - Groq</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      color: #fff;
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 span { background: linear-gradient(90deg, #f97316, #ef4444); padding: 2px 10px; border-radius: 8px; font-size: 0.7rem; }
    .chat-box {
      height: 400px;
      overflow-y: auto;
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    .message.user { align-items: flex-end; }
    .message.bot { align-items: flex-start; }
    .message .bubble {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: rgba(255,255,255,0.1);
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .message .time {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      padding: 0 4px;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .input-area input:focus { border-color: #f97316; }
    .input-area input::placeholder { color: rgba(255,255,255,0.35); }
    .input-area button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-area button:hover { opacity: 0.85; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing {
      color: rgba(255,255,255,0.5);
      font-style: italic;
      font-size: 0.85rem;
      padding: 8px 16px;
    }
    .status {
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      margin-top: 12px;
    }
    .error-msg {
      color: #ff6b6b;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Bot AI <span>Groq</span></h1>
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <div class="bubble">Halo! 👋 Ada yang bisa saya bantu hari ini?</div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="inputMessage" placeholder="Ketik pesan..." autofocus />
      <button id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>
    <div id="statusMsg" class="status">Online — Groq Llama 3.3 70B</div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('inputMessage');
    const sendBtn = document.getElementById('sendBtn');
    const statusMsg = document.getElementById('statusMsg');

    let chatHistory = [];

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      appendMessage('user', msg);
      input.value = '';
      sendBtn.disabled = true;
      statusMsg.textContent = 'Sedang mengetik...';

      const typingEl = document.createElement('div');
      typingEl.className = 'message bot';
      typingEl.innerHTML = '<div class="typing">Bot sedang mengetik...</div>';
      chatBox.appendChild(typingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: chatHistory }),
        });

        const data = await res.json();

        typingEl.remove();

        if (res.ok) {
          appendMessage('bot', data.reply);
          chatHistory.push({ role: 'user', content: msg });
          chatHistory.push({ role: 'assistant', content: data.reply });
          statusMsg.textContent = 'Online — Groq Llama 3.3 70B';
        } else {
          statusMsg.textContent = '❌ Error: ' + (data.error || 'Unknown error');
        }
      } catch (err) {
        typingEl.remove();
        appendMessage('bot', '⚠️ Gagal terhubung ke server. Coba lagi.');
        statusMsg.textContent = '❌ Connection error';
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div><div class="time">' + time + '</div>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
  </script>
</body>
</html>
