<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Chat AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#fff;color:#343541;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.08);border-radius:4px}

    #app{width:100%;max-width:800px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#fff}
    @media(min-width:768px){#app{border-left:1px solid #e5e5e5;border-right:1px solid #e5e5e5;box-shadow:0 0 20px rgba(0,0,0,.04)}}

    /* HEADER */
    .header{display:flex;align-items:center;justify-content:center;padding:12px 16px;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid #e5e5e5;background:#fff;position:relative}
    .header h1{font-size:16px;font-weight:600;color:#343541;display:flex;align-items:center;gap:6px}
    .header h1 .badge{font-size:11px;font-weight:500;color:#8e8ea0;background:#f4f4f5;padding:2px 8px;border-radius:100px}
    .header-actions{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
    .header-btn{width:32px;height:32px;border:none;border-radius:6px;background:transparent;color:#8e8ea0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s}
    .header-btn:hover{background:#f4f4f5;color:#343541}

    /* CHAT */
    .chat-box{flex:1;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:#fff}
    .chat-inner{padding:12px 0 8px;max-width:700px;margin:0 auto;width:100%}
    @media(min-width:768px){.chat-inner{padding:20px 0 8px}}

    .msg{display:flex;gap:16px;padding:8px 24px;line-height:1.6}
    @media(min-width:768px){.msg{padding:12px 32px;gap:20px}}
    .msg.user{background:#fff}
    .msg.assistant{background:#f7f7f8}

    .msg-avatar{width:30px;height:30px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;margin-top:2px}
    .msg.user .msg-avatar{background:#5436da;color:#fff}
    .msg.assistant .msg-avatar{background:#10a37f;color:#fff;font-size:15px}

    .msg-body{flex:1;min-width:0}
    .msg-body .content{font-size:15px;color:#343541;line-height:1.65}
    .msg-body .content p{margin-bottom:10px}
    .msg-body .content p:last-child{margin-bottom:0}
    .msg-body .content ul,.msg-body .content ol{padding-left:20px;margin-bottom:10px}
    .msg-body .content li{margin-bottom:4px}
    .msg-body .content code{background:#f4f4f5;padding:2px 6px;border-radius:4px;font-size:13px;font-family:'SF Mono','Fira Code',monospace;color:#343541}
    .msg-body .content pre{margin:10px 0;border-radius:8px;overflow:hidden;border:1px solid #e5e5e5}
    .msg-body .content pre code{background:#f8f8f9;padding:14px 16px;display:block;overflow-x:auto;font-size:13px;line-height:1.5;border-radius:8px}
    .msg-body .content blockquote{border-left:3px solid #e5e5e5;padding:4px 12px;margin:10px 0;color:#8e8ea0}
    .msg-body .content table{border-collapse:collapse;margin:10px 0;width:100%;font-size:14px}
    .msg-body .content th,.msg-body .content td{border:1px solid #e5e5e5;padding:6px 12px;text-align:left}
    .msg-body .content th{background:#f4f4f5;font-weight:600}
    .msg-body .content a{color:#10a37f;text-decoration:none}
    .msg-body .content a:hover{text-decoration:underline}
    .msg-body .content h1,.msg-body .content h2,.msg-body .content h3,.msg-body .content h4{margin:14px 0 8px;font-weight:600;color:#1d1d1e}
    .msg-body .content h1{font-size:20px}.msg-body .content h2{font-size:17px}.msg-body .content h3{font-size:15px}
    .msg-body .content strong{font-weight:600}
    .msg-body .content img{max-width:100%;border-radius:8px;margin:8px 0}
    .msg-body .content hr{margin:16px 0;border:none;border-top:1px solid #e5e5e5}

    .msg-body .stream-cursor::after{content:'▊';animation:blink 1s step-end infinite;color:#343541;font-size:14px}
    @keyframes blink{50%{opacity:0}}

    .msg-footer{display:flex;align-items:center;gap:8px;margin-top:6px}
    .msg-footer .time{font-size:11px;color:#c5c5d2}

    /* EMPTY */
    .empty{padding:80px 24px 60px;text-align:center;display:flex;flex-direction:column;align-items:center}
    .empty .logo{font-size:52px;margin-bottom:20px;opacity:.5}
    .empty h2{font-size:22px;font-weight:600;color:#343541;margin-bottom:6px}
    .empty p{font-size:14px;color:#8e8ea0;max-width:360px;line-height:1.5}
    .empty .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px;max-width:440px}
    .empty .chips button{background:#f4f4f5;border:1px solid #e5e5e5;border-radius:100px;padding:8px 18px;font-size:13px;color:#343541;cursor:pointer;transition:all .15s}
    .empty .chips button:hover{background:#e5e5e5;border-color:#d1d1d6}

    /* INPUT */
    .input-wrap{flex-shrink:0;padding:0 16px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff}
    .input-inner{max-width:700px;margin:0 auto;position:relative;border:1px solid #c5c5d2;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.03);transition:border-color .2s,box-shadow .2s}
    .input-inner:focus-within{border-color:#8e8ea0;box-shadow:0 2px 12px rgba(0,0,0,.05)}
    .input-inner textarea{width:100%;padding:12px 48px 12px 16px;border:none;border-radius:12px;background:transparent;color:#343541;font-size:15px;font-family:inherit;line-height:1.5;outline:none;resize:none;-webkit-appearance:none;min-height:44px;max-height:160px}
    .input-inner textarea::placeholder{color:#8e8ea0}
    .input-inner textarea:disabled{opacity:.4}
    .send-btn{position:absolute;bottom:7px;right:7px;width:34px;height:34px;border:none;border-radius:8px;background:#343541;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .send-btn:active{background:#1d1d1e}
    .send-btn:disabled{background:#c5c5d2;cursor:default}
    .send-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* STOP button */
    .stop-btn{position:absolute;bottom:7px;right:7px;width:34px;height:34px;border:none;border-radius:8px;background:#ef4444;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;transition:background .15s}
    .stop-btn:active{background:#dc2626}

    /* TOAST */
    .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:#343541;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:100;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>Chat AI <span class="badge">GROQ</span></h1>
      <div class="header-actions">
        <button class="header-btn" onclick="resetChat()" title="Percakapan baru">✕</button>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="chat-inner" id="chatInner">
        <div class="empty">
          <div class="logo">💬</div>
          <h2>Apa yang bisa saya bantu?</h2>
          <p>Groq Llama 3.3 70B — dengan streaming real-time</p>
          <div class="chips">
            <button onclick="quick('Jelaskan AI dalam bahasa sederhana')">🤖 Jelaskan AI</button>
            <button onclick="quick('Buatkan kode Python untuk web scraper')">🐍 Kode Python</button>
            <button onclick="quick('Apa perbedaan HTTP dan HTTPS?')">🌐 HTTP vs HTTPS</button>
          </div>
        </div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-inner">
        <textarea id="inputMsg" rows="1" placeholder="Kirim pesan..." autofocus></textarea>
        <button class="stop-btn" id="stopBtn" onclick="stopStream()">■</button>
        <button class="send-btn" id="sendBtn" onclick="sendMsg()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id)
    const inner = $('chatInner'), input = $('inputMsg'), btn = $('sendBtn'), stopBtn = $('stopBtn')
    const toast = $('toast'), chatBox = $('chatBox')

    let history = [], busy = false, tt = null, abortController = null

    if(typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true })

    input.addEventListener('input', () => {
      input.style.height = 'auto'
      input.style.height = Math.min(input.scrollHeight, 160) + 'px'
    })
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg() }
    })

    function quick(text) { input.value = text; sendMsg() }

    async function sendMsg() {
      const text = input.value.trim()
      if(!text || busy) return

      append('user', text)
      input.value = ''
      input.style.height = 'auto'
      busy = true
      btn.style.display = 'none'
      stopBtn.style.display = 'flex'
      input.disabled = true

      // Create assistant message placeholder
      const empty = inner.querySelector('.empty')
      if(empty) empty.remove()

      const div = document.createElement('div')
      div.className = 'msg assistant'
      div.innerHTML = `
        <div class="msg-avatar">✦</div>
        <div class="msg-body">
          <div class="content stream-cursor"></div>
        </div>`
      inner.appendChild(div)
      const contentEl = div.querySelector('.content')
      scroll()

      try {
        abortController = new AbortController()

        const res = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ message: text, history, stream: true }),
          signal: abortController.signal
        })

        if(!res.ok) {
          const d = await res.json()
          throw new Error(d.error || 'Gagal')
        }

        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        let fullReply = ''
        let firstToken = true

        while(true) {
          const { done, value } = await reader.read()
          if(done) break

          buffer += decoder.decode(value, { stream: true })
          const lines = buffer.split('\n')
          buffer = lines.pop() || ''

          for(const line of lines) {
            if(!line.startsWith('data: ')) continue
            const json = line.slice(6).trim()
            if(!json) continue

            try {
              const data = JSON.parse(json)
              if(data.error) throw new Error(data.error)
              if(data.done) {
                fullReply = data.fullContent || fullReply
                continue
              }
              if(data.content) {
                fullReply += data.content
                // Render markdown live
                try {
                  contentEl.innerHTML = marked.parse(fullReply) + '<span class="stream-cursor"></span>'
                } catch(e) {
                  contentEl.innerHTML = esc(fullReply) + '<span class="stream-cursor"></span>'
                }
                scroll()
                firstToken = false
              }
            } catch(e) {
              if(e.message !== 'Unexpected end of JSON input') console.error(e)
            }
          }
        }

        // Final render
        contentEl.classList.remove('stream-cursor')
        contentEl.innerHTML = marked.parse(fullReply)
        applyHighlight()

        // Add time
        const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})
        const footer = document.createElement('div')
        footer.className = 'msg-footer'
        footer.innerHTML = `<span class="time">${t}</span>`
        div.querySelector('.msg-body').appendChild(footer)

        history.push({role:'user', content:text})
        history.push({role:'assistant', content:fullReply})
        scroll()

      } catch(e) {
        if(e.name === 'AbortError') {
          // stopped by user
        } else {
          div.querySelector('.content').textContent = '⚠️ ' + (e.message || 'Koneksi terputus')
          show('Error: ' + (e.message || 'Koneksi terputus'))
        }
      }

      busy = false
      btn.style.display = 'flex'
      stopBtn.style.display = 'none'
      input.disabled = false
      input.focus()
    }

    function stopStream() {
      if(abortController) {
        abortController.abort()
        abortController = null
      }
    }

    function append(role, text) {
      const u = role === 'user'
      const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})
      const empty = inner.querySelector('.empty')
      if(empty) empty.remove()

      const div = document.createElement('div')
      div.className = `msg ${u ? 'user' : 'assistant'}`
      div.innerHTML = `
        <div class="msg-avatar">${u ? 'U' : '✦'}</div>
        <div class="msg-body">
          <div class="content">${esc(text)}</div>
          <div class="msg-footer"><span class="time">${t}</span></div>
        </div>`
      inner.appendChild(div)
      scroll()
    }

    function resetChat() {
      const msgs = inner.querySelectorAll('.msg')
      if(!msgs.length) return
      history = []
      inner.innerHTML = `
        <div class="empty">
          <div class="logo">💬</div>
          <h2>Apa yang bisa saya bantu?</h2>
          <p>Groq Llama 3.3 70B — dengan streaming real-time</p>
          <div class="chips">
            <button onclick="quick('Jelaskan AI dalam bahasa sederhana')">🤖 Jelaskan AI</button>
            <button onclick="quick('Buatkan kode Python untuk web scraper')">🐍 Kode Python</button>
            <button onclick="quick('Apa perbedaan HTTP dan HTTPS?')">🌐 HTTP vs HTTPS</button>
          </div>
        </div>`
      scroll()
      show('Percakapan baru')
    }

    function applyHighlight() {
      if(typeof hljs !== 'undefined') {
        document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b))
      }
    }

    function scroll() { chatBox.scrollTop = chatBox.scrollHeight }
    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML }
    function show(m) {
      toast.textContent = m; clearTimeout(tt)
      void toast.offsetWidth; toast.classList.add('show')
      tt = setTimeout(() => toast.classList.remove('show'), 1800)
    }
  </script>
</body>
</html>
