<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bot AI · Groq</title>

  <!-- Tailwind CSS (via CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12' },
            dark: { 50:'#f8fafc',100:'#e2e8f0',200:'#cbd5e1',300:'#94a3b8',400:'#64748b',500:'#475569',600:'#334155',700:'#1e293b',800:'#1a1a2e',900:'#0f0c29' },
          },
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue','Arial','sans-serif'] },
          animation: { 'bounce-in':'bounceIn .4s ease both','slide-up':'slideUp .3s ease both','fade-in':'fadeIn .25s ease both','pulse-dot':'pulseDot 2s infinite' },
          keyframes: {
            bounceIn: { '0%':{ transform:'scale(0)',opacity:'0' },'60%':{ transform:'scale(1.08)' },'100%':{ transform:'scale(1)',opacity:'1' } },
            slideUp: { '0%':{ transform:'translateY(20px)',opacity:'0' },'100%':{ transform:'translateY(0)',opacity:'1' } },
            fadeIn: { '0%':{ opacity:'0' },'100%':{ opacity:'1' } },
            pulseDot: { '0%,100%':{ opacity:'1' },'50%':{ opacity:'0.4' } }
          }
        }
      }
    }
  </script>

  <style>
    /* ===== Reset & Base ===== */
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; -webkit-font-smoothing:antialiased; }
    body {
      font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
      background: #0f0c29;
    }
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:2px; }

    /* ===== Container ===== */
    #app {
      width:100%; max-width:480px; height:100dvh; margin:0 auto;
      display:flex; flex-direction:column;
      background:linear-gradient(160deg,#0f0c29 0%,#302b63 45%,#24243e 100%);
      border-left:1px solid rgba(255,255,255,0.05);
      border-right:1px solid rgba(255,255,255,0.05);
      position:relative; overflow:hidden;
    }
    @media (min-width:640px) {
      #app { height:90dvh; max-height:780px; border-radius:32px; border:1px solid rgba(255,255,255,0.08); margin:20px auto; box-shadow:0 25px 60px rgba(0,0,0,.5); }
    }
    @media (max-height:500px) and (orientation:landscape) {
      #app { max-width:100%; height:100dvh; border-radius:0; border:none; }
    }

    /* ===== Header ===== */
    .header {
      padding:18px 20px 14px; flex-shrink:0;
      padding-top:calc(18px + env(safe-area-inset-top,0px));
      background:rgba(255,255,255,0.02);
      border-bottom:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    }
    .header-content { display:flex; align-items:center; gap:10px; }
    .header-avatar {
      width:38px; height:38px; border-radius:12px;
      background:linear-gradient(135deg,#f97316,#ef4444);
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; box-shadow:0 4px 12px rgba(239,68,68,.35);
    }
    .header-info { flex:1; min-width:0; }
    .header-info h1 { color:#fff; font-size:1rem; font-weight:600; letter-spacing:-.2px; display:flex; align-items:center; gap:8px; }
    .header-info h1 .badge {
      background:rgba(249,115,22,.15); color:#fb923c; padding:1px 10px;
      border-radius:20px; font-size:.55rem; font-weight:600; letter-spacing:.3px;
      border:1px solid rgba(249,115,22,.2);
    }
    .header-info .subtitle { color:rgba(255,255,255,.3); font-size:.65rem; margin-top:2px; display:flex; align-items:center; gap:4px; }
    .header-info .subtitle .dot { width:5px; height:5px; border-radius:50%; background:#22c55e; display:inline-block; }
    .header-actions { display:flex; gap:6px; }
    .header-btn {
      width:34px; height:34px; border-radius:10px; border:none;
      background:rgba(255,255,255,.06); color:rgba(255,255,255,.5);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:1rem; transition:all .2s;
    }
    .header-btn:hover { background:rgba(255,255,255,.1); color:#fff; }
    .header-btn:active { transform:scale(.9); }

    /* ===== Chat Messages ===== */
    .chat-box {
      flex:1; overflow-y:auto; padding:16px 14px 8px;
      scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    }
    @media (max-height:500px) { .chat-box { padding:10px 12px 4px; } }

    /* ---- Message Row ---- */
    .msg { display:flex; margin-bottom:16px; animation:fadeIn .3s ease both; }
    .msg.just-sent { animation:bounceIn .35s ease both; }
    .msg-right { justify-content:flex-end; }
    .msg-left { justify-content:flex-start; }

    .msg-avatar {
      width:32px; height:32px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:.85rem; margin-top:4px;
    }
    .msg-left .msg-avatar { margin-right:10px; background:rgba(249,115,22,.15); }
    .msg-right .msg-avatar { margin-left:10px; order:1; background:linear-gradient(135deg,#f97316,#ef4444); }

    .msg-body { max-width:78%; min-width:0; }
    .msg-bubble {
      padding:11px 15px; border-radius:18px; font-size:.9rem; line-height:1.55;
      word-wrap:break-word; position:relative;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }
    .msg-left .msg-bubble {
      background:rgba(255,255,255,.07);
      color:#e8e8e8; border-bottom-left-radius:5px;
      border:1px solid rgba(255,255,255,.04);
    }
    .msg-right .msg-bubble {
      background:linear-gradient(135deg,#f97316,#ef4444);
      color:#fff; border-bottom-right-radius:5px;
    }
    .msg-time {
      font-size:.58rem; color:rgba(255,255,255,.25);
      margin-top:4px; padding:0 4px;
      display:flex; align-items:center; gap:4px;
    }
    .msg-left .msg-time { justify-content:flex-start; }
    .msg-right .msg-time { justify-content:flex-end; }

    /* ---- Typing ---- */
    .typing-bubble {
      display:flex; align-items:center; gap:5px;
      padding:13px 18px; background:rgba(255,255,255,.07);
      border-radius:18px; border-bottom-left-radius:5px;
      border:1px solid rgba(255,255,255,.04);
    }
    .typing-bubble .dot {
      width:7px; height:7px; border-radius:50%;
      background:rgba(255,255,255,.35);
      animation:typingAnim 1.4s infinite ease-in-out;
    }
    .typing-bubble .dot:nth-child(2) { animation-delay:.2s; }
    .typing-bubble .dot:nth-child(3) { animation-delay:.4s; }
    @keyframes typingAnim {
      0%,60%,100% { transform:translateY(0); background:rgba(255,255,255,.35); }
      30% { transform:translateY(-7px); background:rgba(255,255,255,.8); }
    }

    /* ---- Divider ---- */
    .divider {
      display:flex; align-items:center; gap:12px; margin:20px 0 14px;
      animation:fadeIn .4s ease both;
    }
    .divider-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent); }
    .divider-text { color:rgba(255,255,255,.2); font-size:.6rem; white-space:nowrap; letter-spacing:.5px; }

    /* ===== Input Area ===== */
    .input-area {
      padding:10px 14px 16px; flex-shrink:0; display:flex; gap:10px; align-items:center;
      padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
      border-top:1px solid rgba(255,255,255,.04);
      background:rgba(255,255,255,.02);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    }
    @media (max-height:500px) { .input-area { padding:6px 10px 8px; gap:8px; } }

    .input-wrap {
      flex:1; position:relative;
    }
    .input-wrap input {
      width:100%; padding:12px 18px;
      border-radius:26px; border:1.5px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04); color:#fff;
      font-size:.92rem; font-family:inherit; outline:none;
      transition:border-color .25s,box-shadow .25s,background .25s;
      -webkit-appearance:none;
    }
    .input-wrap input:focus {
      border-color:#f97316;
      background:rgba(255,255,255,.06);
      box-shadow:0 0 0 3px rgba(249,115,22,.12);
    }
    .input-wrap input::placeholder { color:rgba(255,255,255,.25); }
    .input-wrap input:disabled { opacity:.4; }

    .send-btn {
      width:46px; height:46px; border:none; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#f97316,#ef4444);
      color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all .15s; box-shadow:0 4px 18px rgba(239,68,68,.35);
      position:relative;
    }
    .send-btn:active { transform:scale(.88); }
    .send-btn:disabled { opacity:.35; transform:none; box-shadow:none; }
    .send-btn svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; margin-left:2px; }

    /* ===== Toast ===== */
    .toast {
      position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px);
      background:rgba(255,255,255,.1); backdrop-filter:blur(20px);
      padding:10px 20px; border-radius:14px; color:#fff; font-size:.8rem;
      border:1px solid rgba(255,255,255,.08);
      opacity:0; transition:all .35s ease; pointer-events:none; z-index:100;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.15); color:#fca5a5; }
    .toast.success { border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.1); color:#86efac; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header (Tencent TDesign inspired) -->
    <div class="header">
      <div class="header-content">
        <div class="header-avatar">🤖</div>
        <div class="header-info">
          <h1>
            Bot AI <span class="badge">Groq</span>
          </h1>
          <div class="subtitle">
            <span class="dot"></span>
            <span id="statusText">Llama 3.3 70B · Siap membantu</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="header-btn" onclick="resetChat()" title="Mulai ulang">⟳</button>
        </div>
      </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-box" id="chatBox">
      <!-- Welcome message injected by JS -->
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap">
        <input type="text" id="inputMsg" placeholder="Ketik pesan..." autofocus />
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><polyline points="22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== State =====
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('inputMsg');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('statusText');
    const toast = document.getElementById('toast');

    let history = [];
    let busy = false;
    let toastTimer = null;

    // ===== Welcome message =====
    function showWelcome() {
      const now = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
      chatBox.innerHTML = `
        <div class="msg msg-left">
          <div class="msg-avatar">🤖</div>
          <div class="msg-body">
            <div class="msg-bubble">👋 Halo! Saya asisten AI bertenaga Groq Llama 3.3. Ada yang bisa dibantu?</div>
            <div class="msg-time">${now}</div>
          </div>
        </div>
      `;
    }
    showWelcome();

    // ===== Keyboard =====
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
    });
    input.addEventListener('focus', () => setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 350));

    // ===== Send =====
    async function sendMsg() {
      const text = input.value.trim();
      if (!text || busy) return;

      // User message
      appendMsg('user', text);
      input.value = '';
      busy = true; sendBtn.disabled = true; input.disabled = true;
      setStatus('Mengetik...');

      // Typing indicator
      const typingEl = document.createElement('div');
      typingEl.className = 'msg msg-left';
      typingEl.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        </div>
      `;
      chatBox.appendChild(typingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ message: text, history })
        });
        const data = await res.json();
        typingEl.remove();

        if (res.ok) {
          appendMsg('bot', data.reply);
          history.push({ role:'user', content: text });
          history.push({ role:'assistant', content: data.reply });
          setStatus('Online · Llama 3.3 70B');
        } else {
          showToast(data.error || 'Terjadi kesalahan', 'error');
          setStatus('Error');
        }
      } catch (err) {
        typingEl.remove();
        showToast('Gagal terhubung ke server', 'error');
        setStatus('Offline');
      }

      busy = false; sendBtn.disabled = false; input.disabled = false;
      input.focus();
    }

    // ===== Append Message =====
    function appendMsg(role, text) {
      const isUser = role === 'user';
      const now = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });

      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'msg-right' : 'msg-left'} just-sent`;
      div.innerHTML = `
        <div class="msg-avatar">${isUser ? '😊' : '🤖'}</div>
        <div class="msg-body">
          <div class="msg-bubble">${escHtml(text)}</div>
          <div class="msg-time">${now}</div>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ===== Reset =====
    function resetChat() {
      if (history.length === 0) return;
      history = [];
      chatBox.innerHTML = '';
      showWelcome();
      setStatus('Online · Llama 3.3 70B');
      showToast('Percakapan telah direset', 'success');
    }

    // ===== Helpers =====
    function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function setStatus(t) { if (statusEl) statusEl.textContent = t; }

    function showToast(msg, type = '') {
      toast.textContent = msg;
      toast.className = 'toast ' + type;
      clearTimeout(toastTimer);
      // force reflow
      void toast.offsetWidth;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
