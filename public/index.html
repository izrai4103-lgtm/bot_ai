<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0c29" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bot AI - Groq</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;

      /* Desktop tweak */
      @media (min-width: 768px) {
        height: 90dvh;
        max-height: 800px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin: 20px auto;
      }

      /* Landscape phone */
      @media (max-height: 500px) and (orientation: landscape) {
        max-width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
      }
    }

    /* HEADER */
    .header {
      padding: 16px 20px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));

      @media (max-height: 500px) {
        padding: 8px 16px 6px;
      }
    }

    .header h1 {
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header h1 .badge {
      background: linear-gradient(135deg, #f97316, #ef4444);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .header .subtitle {
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.7rem;
      margin-top: 4px;
      font-weight: 400;
    }

    /* CHAT BOX */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;

      @media (max-height: 500px) {
        padding: 8px 12px;
      }
    }

    .chat-box::-webkit-scrollbar {
      width: 4px;
    }
    .chat-box::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    /* MESSAGES */
    .message {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.25s ease forwards;

      @media (max-height: 500px) {
        margin-bottom: 8px;
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .message.user {
      align-items: flex-end;
    }
    .message.bot {
      align-items: flex-start;
    }

    .message .bubble {
      max-width: 85%;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.92rem;
      line-height: 1.55;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      border-bottom-right-radius: 4px;
      text-align: left;
    }

    .message.bot .bubble {
      background: rgba(255, 255, 255, 0.08);
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .message .time {
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 4px;
      padding: 0 6px;
    }

    .message.bot .time {
      text-align: left;
    }
    .message.user .time {
      text-align: right;
    }

    /* TYPING INDICATOR */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-width: 70px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: typingAnim 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingAnim {
      0%, 60%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.4); }
      30% { transform: translateY(-6px); background: rgba(255, 255, 255, 0.8); }
    }

    /* INPUT AREA */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));

      @media (max-height: 500px) {
        padding: 8px 12px;
      }
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-wrapper input:disabled {
      opacity: 0.5;
    }

    .input-area .send-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
    }

    .input-area .send-btn:active {
      transform: scale(0.92);
    }

    .input-area .send-btn:disabled {
      opacity: 0.4;
      transform: none;
      box-shadow: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: 2px;
    }

    /* STATUS BAR */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 16px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.04);

      @media (max-height: 500px) {
        display: none;
      }
    }

    .status-bar .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-bar .status-text {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.65rem;
      font-weight: 400;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(255, 255, 255, 0.2);
      text-align: center;
      padding: 40px 20px;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state h2 {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      max-width: 240px;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- HEADER -->
    <div class="header">
      <h1>
        <span>🤖</span> Bot AI <span class="badge">Groq</span>
      </h1>
      <div class="subtitle">Llama 3.3 70B — Bahasa Indonesia</div>
    </div>

    <!-- CHAT BOX -->
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <div class="bubble">Halo! 👋 Ada yang bisa saya bantu?</div>
        <div class="time">Just now</div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="inputMessage" placeholder="Ketik pesan..." autofocus />
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24"><polyline points="22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>

    <!-- STATUS -->
    <div class="status-bar">
      <span class="dot"></span>
      <span class="status-text" id="statusText">Online — Groq Llama 3.3 70B</span>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('inputMessage');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');

    let chatHistory = [];
    let isSending = false;

    // Auto-resize input on mobile keyboard show
    input.addEventListener('focus', () => {
      setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 300);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg || isSending) return;

      appendMessage('user', msg);
      input.value = '';
      isSending = true;
      sendBtn.disabled = true;
      input.disabled = true;
      setStatus('Mengetik...');

      // Typing indicator
      const typingEl = document.createElement('div');
      typingEl.className = 'message bot';
      typingEl.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      chatBox.appendChild(typingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: chatHistory }),
        });

        const data = await res.json();
        typingEl.remove();

        if (res.ok) {
          appendMessage('bot', data.reply);
          chatHistory.push({ role: 'user', content: msg });
          chatHistory.push({ role: 'assistant', content: data.reply });
          setStatus('Online — Groq Llama 3.3 70B');
        } else {
          appendMessage('bot', '⚠️ ' + (data.error || 'Terjadi kesalahan'));
          setStatus('Error — ' + (data.error || 'Unknown'));
        }
      } catch (err) {
        typingEl.remove();
        appendMessage('bot', '⚠️ Gagal terhubung ke server. Coba lagi nanti.');
        setStatus('Offline — Connection error');
      }

      isSending = false;
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div><div class="time">' + time + '</div>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function setStatus(text) {
      if (statusText) statusText.textContent = text;
    }
  </script>
</body>
</html>
